<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdn.jsdelivr.net https://unpkg.com https://cdn.quilljs.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.quilljs.com; img-src 'self' data: blob: https:; connect-src 'self' https://firestore.googleapis.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://firebasestorage.googleapis.com https://dev-alex-photo-cms.pantheonsite.io; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Article | Alex's Photo Board</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" referrerpolicy="strict-origin-when-cross-origin"></script>
  <script type="module" src="article.js" defer></script>
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>
      <a href="index.html" class="home-link">📸 Alex's Photo Board</a>
    </h1>
    <nav class="menu-bar">
      <div class="menu">
        <button id="communityBtn">Community ▼</button>
        <div id="communityMenu" class="hidden">
          <a href="gallery.html">🖼️ Gallery</a>
          <a href="upload.html">📤 Image</a>
        </div>
      </div>

      <div class="menu">
        <button id="newsBtn">What's News ▼</button>
        <div id="newsMenu" class="hidden">
          <a href="news.html">🗞️ News</a>
          <a href="history.html">📚 History Stories</a>
        </div>
      </div>
    </nav>
  </header>

<main class="article-page">
  <!-- Hero-style image full width -->
  <div class="hero-image-container">
    <img id="articleImage" alt="Article Image" />
  </div>

  <!-- Title and content -->
  <h2 id="articleTitle"></h2>
  <p id="articleDate" class="timestamp"></p>
  <div id="articleContent" class="article-body"></div>
</main>

  <footer>
    © 2025 Alex's Photo Board | All Rights Reserved
  </footer>
</body>
</html>

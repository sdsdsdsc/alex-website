<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📸 Alex's Photo Board</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <!-- Header -->
  <header>
    <h1>📸 Alex's Photo Board</h1>
  </header>

  <!-- Menu Bar -->
  <div class="menu-bar">
    <!-- Community -->
    <div class="menu">
      <button id="communityBtn">Community ▼</button>
      <div id="communityMenu" class="hidden">
        <button id="galleryBtn">🖼️ Gallery</button>
        <button id="imageUploadBtn">📤 Image</button>
      </div>
    </div>

    <!-- What's News -->
    <div class="menu">
      <button id="newsBtn">What's News ▼</button>
      <div id="newsMenu" class="hidden">
        <button id="showNews">🗞️ News</button>
        <button id="showHistory">📚 History Stories</button>
      </div>
    </div>
  </div>

  <!-- Upload Section -->
  <div class="upload-section hidden" id="uploadSection">
    <input type="file" id="fileInput" />
    <input type="text" id="nameInput" placeholder="Your name" />
    <input type="text" id="msgInput" placeholder="Leave a message" />
    <button id="uploadBtn">Upload</button>
  </div>

  <!-- Gallery Section -->
  <div id="gallerySection" class="hidden">
    <h2>Gallery</h2>
    <div id="gallery"></div>
  </div>

  <!-- News Section -->
  <div id="newsSection" class="hidden">
    <h2>Latest News</h2>
    <div id="newsContainer" class="article-container"></div>
  </div>

  <!-- History Section -->
  <div id="historySection" class="hidden">
    <h2>History Stories</h2>
    <div id="historyContainer" class="article-container"></div>
  </div>
</body>
</html>

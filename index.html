<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📸 Alex's Photo Board</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <!-- Top Bar -->
  <header>
    <h1>📸 Alex's Photo Board</h1>
  </header>

  <!-- Community Menu -->
  <div class="menu">
    <button id="communityBtn">Community ▼</button>
    <div id="menuContent" class="hidden">
      <button id="imageUploadBtn">🖼️ Image</button>
    </div>
  </div>

  <!-- Hidden Upload Section -->
  <div class="upload-section hidden" id="uploadSection">
    <input type="file" id="fileInput">
    <input type="text" id="nameInput" placeholder="Your name">
    <input type="text" id="msgInput" placeholder="Leave a message">
    <button id="uploadBtn">Upload</button>
  </div>

  <h2>Gallery</h2>
  <div id="gallery"></div>
</body>
</html>

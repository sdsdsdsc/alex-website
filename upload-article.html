<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload New Article</title>

  <!-- Quill Editor -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <style>
    body { font-family: system-ui; max-width: 900px; margin: 40px auto; }
    #editor { height: 300px; background: #fff; }
    button { padding: 10px 20px; margin-top: 20px; }
  </style>
</head>

<body>
  <h1>📰 Upload New Article</h1>
  <input type="text" id="title" placeholder="Article Title" style="width:100%;padding:8px;margin-bottom:10px;">
  <select id="category" style="width:100%;padding:8px;margin-bottom:10px;">
    <option value="">-- choose category --</option>
    <option value="news">News</option>
    <option value="history">History</option>
  </select>

  <!-- Live rich text editor -->
  <div id="editor"></div>

  <!-- Optional cover image -->
  <input type="file" id="imageFile" accept="image/*" style="margin-top:20px;"><br>

  <button id="publishBtn">Publish</button>

  <!-- Quill + Firebase -->
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-storage.js";

    // === Firebase Config ===
    const firebaseConfig = {
      apiKey: "AIzaSyDr8hSsoad4Ut1v5J1r2f0eSau0msrB6V4",
      authDomain: "alexs-community-efcd8.firebaseapp.com",
      projectId: "alexs-community-efcd8",
      storageBucket: "alexs-community-efcd8.firebasestorage.app",
      messagingSenderId: "214395622099",
      appId: "1:214395622099:web:44f99a181741caf3117a26"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // === Quill Setup ===
    const quill = new Quill('#editor', {
      theme: 'snow',
      placeholder: 'Write your article here...',
      modules: {
        toolbar: [
          [{ header: [1, 2, 3, false] }],
          ['bold', 'italic', 'underline', 'strike'],
          ['link', 'blockquote', 'code-block', 'image'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          ['clean']
        ]
      }
    });

    // === Publish Article ===
    document.getElementById("publishBtn").addEventListener("click", async () => {
      const title = document.getElementById("title").value.trim();
      const category = document.getElementById("category").value;
      const imageFile = document.getElementById("imageFile").files[0];
      const content = quill.root.innerHTML;

      if (!title || !category || !content) {
        alert("Please fill out all fields.");
        return;
      }

      try {
        // upload image if selected
        let imageUrl = "";
        if (imageFile) {
          const imgRef = ref(storage, `article-images/${Date.now()}_${imageFile.name}`);
          await uploadBytes(imgRef, imageFile);
          imageUrl = await getDownloadURL(imgRef);
        }

        // upload article HTML
        const htmlBlob = new Blob([content], { type: "text/html" });
        const htmlRef = ref(storage, `articles/${Date.now()}_${title.replace(/\s+/g, "_")}.html`);
        await uploadBytes(htmlRef, htmlBlob);
        const htmlUrl = await getDownloadURL(htmlRef);

        // save to Firestore
        await addDoc(collection(db, category), {
          title,
          htmlUrl,
          imageUrl,
          createdAt: serverTimestamp(),
          jsonld: {
            "@context": {
              "schema": "https://schema.org/",
              "dc": "http://purl.org/dc/elements/1.1/"
            },
            "@type": "schema:Article",
            "schema:name": title,
            "schema:contentUrl": htmlUrl,
            "schema:image": imageUrl,
            "schema:source": "Alex's Photo Board (Firebase)",
            "dc:date": new Date().toISOString()
          }
        });

        alert("✅ Article published!");
        quill.root.innerHTML = "";
        document.getElementById("title").value = "";
        document.getElementById("category").value = "";
        document.getElementById("imageFile").value = "";
      } catch (err) {
        console.error("Error uploading article:", err);
        alert("❌ Upload failed. Check console for details.");
      }
    });
  </script>
</body>
</html>

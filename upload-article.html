<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload a New Article</title>

  <!-- ✅ Quill CSS (stable and compatible version) -->
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.6/dist/quill.snow.css" rel="stylesheet">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 900px;
      margin: 50px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin: 5px 0 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    #editor {
      height: 350px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 10px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Upload a New Article</h2>

    <label for="title">Article Title</label>
    <input type="text" id="title" placeholder="Enter article title" />

    <label for="coverUrl">Cover Image URL (optional)</label>
    <input type="text" id="coverUrl" placeholder="Paste or leave blank" />

    <label>Post Type</label><br />
    <input type="radio" id="news" name="type" value="news" checked />
    <label for="news">News</label>
    <input type="radio" id="history" name="type" value="history" />
    <label for="history">History Stories</label>

    <label>Article Content (Rich Editor)</label>
    <div id="editor"></div>

    <button id="publishBtn">Publish Article</button>
  </div>

  <!-- ✅ Quill JS -->
  <script src="https://cdn.jsdelivr.net/npm/quill@1.3.6/dist/quill.min.js"></script>

  <!-- ✅ Firebase compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-storage-compat.js"></script>

  <script>
    // === Firebase Config ===
    const firebaseConfig = {
      apiKey: "AIzaSyDr8hSsoad4Ut1v5J1r2f0eSau0msrB6V4",
      authDomain: "alexs-community-efcd8.firebaseapp.com",
      projectId: "alexs-community-efcd8",
      storageBucket: "alexs-community-efcd8.firebasestorage.app",
      messagingSenderId: "214395622099",
      appId: "1:214395622099:web:44f99a181741caf3117a26",
    };

    // === Initialize Firebase ===
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    // === Full Quill Toolbar ===
    const quill = new Quill("#editor", {
      theme: "snow",
      placeholder: "Write your article here...",
      modules: {
        toolbar: [
          [{ header: [1, 2, 3, 4, 5, 6, false] }],
          ["bold", "italic", "underline", "strike"],
          [{ color: [] }, { background: [] }],
          [{ align: [] }],
          [{ list: "ordered" }, { list: "bullet" }, { indent: "-1" }, { indent: "+1" }],
          ["blockquote", "code-block"],
          ["link", "image", "video"],
          ["clean"],
        ],
      },
    });

    // === Upload images from Quill to Firebase ===
    async function uploadQuillImages(quill) {
      const delta = quill.getContents();
      const newOps = [];

      for (const op of delta.ops) {
        if (op.insert && op.insert.image && op.insert.image.startsWith("data:")) {
          const imageRef = storage.ref(`article-images/${Date.now()}.jpg`);
          const response = await fetch(op.insert.image);
          const blob = await response.blob();
          await imageRef.put(blob);
          const downloadURL = await imageRef.getDownloadURL();
          newOps.push({ insert: { image: downloadURL } });
        } else {
          newOps.push(op);
        }
      }

      quill.setContents({ ops: newOps });
      return quill.root.innerHTML;
    }

    // === Publish Button ===
    document.getElementById("publishBtn").addEventListener("click", async () => {
      const title = document.getElementById("title").value.trim();
      let coverUrl = document.getElementById("coverUrl").value.trim();
      const type = document.querySelector('input[name="type"]:checked').value;

      if (!title) return alert("Please enter a title.");

      try {
        const processedHtml = await uploadQuillImages(quill);

        // Auto grab first image if cover is blank
        if (!coverUrl) {
          const match = processedHtml.match(/<img[^>]+src="([^">]+)"/);
          if (match) coverUrl = match[1];
        }

        const articleData = {
          title,
          htmlContent: processedHtml,
          imageUrl: coverUrl || "",
          createdAt: new Date(),
          jsonld: {
            "@context": {
              schema: "https://schema.org/",
              dc: "http://purl.org/dc/elements/1.1/",
            },
            "@type": "schema:Article",
            "schema:name": title,
            "schema:contentUrl": "",
            "schema:image": coverUrl || "",
            "dc:date": new Date().toISOString(),
            "schema:source": "Alex's Photo Board (Firestore)",
          },
        };

        await db.collection(type).add(articleData);
        alert("✅ Article published successfully!");
        location.reload();
      } catch (error) {
        console.error("Upload failed:", error);
        alert("❌ Upload failed. Check console for details.");
      }
    });
  </script>
</body>
</html>

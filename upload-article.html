<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload New Article | Alex's Photo Board</title>

  <!-- Quill CSS -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 20px;
      background: #fafafa;
    }
    #editor-container {
      height: 350px;
      background: white;
    }
    button {
      background: #0066ff;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #004fcc; }
    label { font-weight: bold; }
    input, textarea { width: 100%; margin: 6px 0 12px; }
  </style>
</head>
<body>
  <h2>📝 Upload New Article</h2>

  <form id="uploadForm">
    <label>Article Title</label>
    <input type="text" id="title" placeholder="Enter article title" required>

    <label>Cover Image URL</label>
    <input type="text" id="imageUrl" placeholder="Paste image URL">

    <label>Post Type</label><br>
    <label><input type="radio" name="type" value="news" checked> News</label>
    <label><input type="radio" name="type" value="history"> History Stories</label>
    <br><br>

    <label>Article Content (Rich Editor)</label>
    <!-- Full Quill toolbar -->
    <div id="toolbar">
      <span class="ql-formats">
        <select class="ql-header">
          <option selected></option>
          <option value="1"></option>
          <option value="2"></option>
        </select>
        <select class="ql-font"></select>
      </span>
      <span class="ql-formats">
        <button class="ql-bold"></button>
        <button class="ql-italic"></button>
        <button class="ql-underline"></button>
        <button class="ql-strike"></button>
      </span>
      <span class="ql-formats">
        <button class="ql-link"></button>
        <button class="ql-image"></button>
        <button class="ql-video"></button>
      </span>
      <span class="ql-formats">
        <button class="ql-list" value="ordered"></button>
        <button class="ql-list" value="bullet"></button>
        <button class="ql-indent" value="-1"></button>
        <button class="ql-indent" value="+1"></button>
      </span>
      <span class="ql-formats">
        <select class="ql-align"></select>
        <select class="ql-color"></select>
        <select class="ql-background"></select>
      </span>
      <span class="ql-formats">
        <button class="ql-clean"></button>
      </span>
    </div>

    <div id="editor-container"></div>
    <br>
    <button type="submit">Publish Article</button>
  </form>

  <!-- Quill JS -->
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDr8hSsoad4Ut1v5J1r2f0eSau0msrB6V4",
      authDomain: "alexs-community-efcd8.firebaseapp.com",
      projectId: "alexs-community-efcd8",
      storageBucket: "alexs-community-efcd8.firebasestorage.app",
      messagingSenderId: "214395622099",
      appId: "1:214395622099:web:44f99a181741caf3117a26"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // === Initialize Quill (FULL TOOLBAR) ===
    const quill = new Quill("#editor-container", {
      theme: "snow",
      modules: { toolbar: "#toolbar" }
    });

    // === Upload Form Handler ===
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("title").value.trim();
      const imageUrl = document.getElementById("imageUrl").value.trim();
      const type = document.querySelector("input[name='type']:checked").value;
      const htmlContent = quill.root.innerHTML;

      if (!title || !htmlContent) {
        alert("Please enter both title and content.");
        return;
      }

      const jsonld = {
        "@context": {
          "schema": "https://schema.org/",
          "dc": "http://purl.org/dc/elements/1.1/"
        },
        "@type": "schema:Article",
        "schema:name": title,
        "schema:image": imageUrl,
        "schema:contentUrl": window.location.href,
        "schema:source": "Alex's Photo Board (Firestore)",
        "dc:date": new Date().toISOString()
      };

      try {
        await addDoc(collection(db, type), {
          title,
          imageUrl,
          htmlContent,
          jsonld,
          createdAt: serverTimestamp()
        });

        alert("✅ Article uploaded successfully!");
        quill.setContents([]);
        document.getElementById("uploadForm").reset();
      } catch (error) {
        console.error("Error uploading:", error);
        alert("❌ Upload failed. Check console for details.");
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Article</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDr8hSsoad4Ut1v5J1r2f0eSau0msrB6V4",
      authDomain: "alexs-community-efcd8.firebaseapp.com",
      projectId: "alexs-community-efcd8",
      storageBucket: "alexs-community-efcd8.firebasestorage.app",
      messagingSenderId: "214395622099",
      appId: "1:214395622099:web:44f99a181741caf3117a26"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("title").value.trim();
      const imageUrl = document.getElementById("imageUrl").value.trim();
      const type = document.querySelector("input[name='type']:checked").value;
      const htmlContent = document.getElementById("htmlContent").value;

      if (!title || !htmlContent) {
        alert("Title and HTML content are required.");
        return;
      }

      const jsonld = {
        "@context": {
          "schema": "https://schema.org/",
          "dc": "http://purl.org/dc/elements/1.1/"
        },
        "@type": "schema:Article",
        "schema:name": title,
        "schema:contentUrl": window.location.href,
        "schema:image": imageUrl,
        "schema:source": "Alex's Photo Board (Firestore)",
        "dc:date": new Date().toISOString()
      };

      try {
        await addDoc(collection(db, type), {
          title,
          imageUrl,
          htmlContent,
          jsonld,
          createdAt: serverTimestamp()
        });

        alert("✅ Article uploaded successfully!");
        document.getElementById("uploadForm").reset();
      } catch (error) {
        console.error("Error uploading article:", error);
        alert("Upload failed. Check console for details.");
      }
    });
  </script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>📝 Upload New Article</h2>
  <form id="uploadForm">
    <label>Article Title</label><br>
    <input type="text" id="title" style="width: 100%; margin-bottom: 10px;" /><br>

    <label>Cover Image URL</label><br>
    <input type="text" id="imageUrl" style="width: 100%; margin-bottom: 10px;" /><br>

    <label>Post Type</label><br>
    <label><input type="radio" name="type" value="news" checked> News</label>
    <label><input type="radio" name="type" value="history"> History Stories</label><br><br>

    <label>HTML Content</label><br>
    <textarea id="htmlContent" rows="15" style="width:100%;"></textarea><br><br>

    <button type="submit">Upload Article</button>
  </form>
</body>
</html>

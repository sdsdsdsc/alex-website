<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload New Article</title>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <style>
    body {
      max-width: 800px;
      margin: 2rem auto;
      font-family: sans-serif;
    }
    #editor {
      height: 300px;
      background: #fff;
      border: 1px solid #ccc;
    }
    button {
      padding: 8px 16px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0d47a1;
    }
  </style>
</head>
<body>
  <h1>🖋️ Upload New Article</h1>

  <form id="uploadForm">
    <label>Title:</label><br>
    <input type="text" id="title" required style="width: 100%;"><br><br>

    <label>Category:</label><br>
    <select id="category" required>
      <option value="news">News</option>
      <option value="history">History</option>
    </select><br><br>

    <label>Article Content:</label>
    <div id="editor"></div><br>

    <button type="submit">Upload Article</button>
  </form>

  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // === Firebase Config ===
    const firebaseConfig = {
      apiKey: "AIzaSyDr8hSsoad4Ut1v5J1r2f0eSau0msrB6V4",
      authDomain: "alexs-community-efcd8.firebaseapp.com",
      projectId: "alexs-community-efcd8",
      storageBucket: "alexs-community-efcd8.firebasestorage.app",
      messagingSenderId: "214395622099",
      appId: "1:214395622099:web:44f99a181741caf3117a26"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // === Quill Init ===
    const quill = new Quill("#editor", {
      theme: "snow",
      placeholder: "Write something amazing...",
      modules: {
        toolbar: [
          [{ header: [1, 2, 3, false] }],
          ["bold", "italic", "underline"],
          ["link", "blockquote", "code-block"],
          [{ list: "ordered" }, { list: "bullet" }],
          ["clean"]
        ]
      }
    });

    // === Submit Handler ===
    const form = document.getElementById("uploadForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("title").value;
      const category = document.getElementById("category").value;
      const contentHTML = quill.root.innerHTML;
      const createdAt = new Date().toISOString();

      // Build JSON-LD metadata
      const jsonld = {
        "@context": {
          "schema": "https://schema.org/",
          "dc": "http://purl.org/dc/elements/1.1/"
        },
        "@type": "schema:Article",
        "schema:name": title,
        "schema:creator": {
          "@type": "schema:Person",
          "schema:name": "Alex"
        },
        "schema:source": "Alex's Photo Board (Firestore)",
        "dc:date": createdAt
      };

      try {
        await addDoc(collection(db, category), {
          title,
          category,
          content: contentHTML,
          jsonld,
          createdAt: serverTimestamp(),
          author: "Alex",
        });

        alert("✅ Article + metadata uploaded!");
        quill.root.innerHTML = "";
        form.reset();
      } catch (error) {
        console.error("Error uploading article:", error);
        alert("❌ Upload failed. Check console for details.");
      }
    });
  </script>
</body>
</html>

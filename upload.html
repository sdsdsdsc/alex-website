<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload | Alex's Photo Board</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>
  <a href="index.html" class="home-link">📸 Alex's Photo Board</a>
</h1>
    <nav class="menu-bar">
  <div class="menu">
    <button id="communityBtn">Community ▼</button>
    <div id="communityMenu" class="hidden">
      <button onclick="window.location.href='gallery.html'">🖼️ Gallery</button>
      <button onclick="window.location.href='upload.html'">📤 Image</button>
    </div>
  </div>

  <div class="menu">
    <button id="newsBtn">What's News ▼</button>
    <div id="newsMenu" class="hidden">
      <button onclick="window.location.href='news.html'">🗞️ News</button>
      <button onclick="window.location.href='history.html'">📚 History Stories</button>
    </div>
  </div>

  <!-- 🗺️ New top-level Map tab -->
  <div class="menu">
    <button onclick="window.location.href='map.html'">🗺️ Map</button>
  </div>
</nav>
  </header>

  <section class="upload-section">
    <h2>Upload Your Image</h2>
    <label for="fileInput">Choose Image</label>
    <input type="file" id="fileInput" accept="image/*">

    <label for="nameInput">Your Name</label>
    <input type="text" id="nameInput" placeholder="Your name">

    <label for="msgInput">Message</label>
    <input type="text" id="msgInput" placeholder="Leave a message">
    <button id="uploadBtn">Upload</button>
  </section>

  <footer>
    © 2025 Alex's Photo Board | All Rights Reserved
  </footer>
</body>
</html>

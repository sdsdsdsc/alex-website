<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Map | Alex's Photo Board</title>
  <link rel="stylesheet" href="style.css">

  <!-- Leaflet Map Library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
 
  <!-- Firebase -->
  <script type="module" src="map.js" defer></script>
</head>
<body>
  <header>
    <h1>
  <a href="index.html" class="home-link">📸 Alex's Photo Board</a>
</h1>
    <nav class="menu-bar">
  <div class="menu">
    <button id="communityBtn">Community ▼</button>
    <div id="communityMenu" class="hidden">
      <button onclick="window.location.href='gallery.html'">🖼️ Gallery</button>
      <button onclick="window.location.href='upload.html'">📤 Image</button>
    </div>
  </div>

  <div class="menu">
    <button id="newsBtn">What's News ▼</button>
    <div id="newsMenu" class="hidden">
      <button onclick="window.location.href='news.html'">🗞️ News</button>
      <button onclick="window.location.href='history.html'">📚 History Stories</button>
    </div>
  </div>

  <!-- 🗺️ New top-level Map tab -->
  <div class="menu">
    <button onclick="window.location.href='map.html'">🗺️ Map</button>
  </div>
</nav>
  </header>

  <section>
    <h2 style="text-align:center; margin-top:20px;">Explore & Contribute to the Map</h2>
    <p style="text-align:center;">Click once on the map to place a point, then fill in the popup form to save all details at once.</p>
    <p style="text-align:center;">Use the draw toolbar to add polygons, then add an optional title and description.</p>
    <div id="map" style="height:600px; width:90%; margin:20px auto; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.2);"></div>
  </section>

  <footer>
    © 2025 Alex's Photo Board | All Rights Reserved
  </footer>
</body>
</html>
